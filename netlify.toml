# MedFinance AI na Netlify: site estático (apps/web) + API como Function + PostgreSQL (Netlify DB/Neon).
[build]
  command = "bash scripts/netlify-build.sh"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"
  # Instala devDependencies (Vite, Prisma CLI) mesmo com NODE_ENV=production
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Módulos com binários nativos/engines são enviados fora do bundle
  external_node_modules = ["@prisma/client", ".prisma", "@node-rs/argon2"]
  # Inclui só o motor Prisma do runtime da Function (Amazon Linux) e exclui WASM de outros bancos — mantém o pacote bem abaixo de 50 MB
  included_files = [
    "node_modules/.prisma/client/**",
    "!node_modules/.prisma/client/libquery_engine-debian-*",
    "!node_modules/@prisma/client/runtime/*.wasm*",
    "!node_modules/@prisma/client/runtime/*wasm-base64*",
    "!node_modules/@node-rs/argon2-linux-x64-musl/**",
  ]

# SPA: rotas do React Router caem no index.html (a API é atendida pela Function em /api/*)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
